# Flatpak manifest for DLSS Manager
# This manifest wraps the PyInstaller-built Linux application
#
# Build process:
# 1. Build with PyInstaller: uv run pyinstaller DLSS_Manager_Linux.spec
# 2. Run flatpak-builder with this manifest
#
# Local build (WSL2):
#   ./build_flatpak.sh
#
# Or manually:
#   uv run pyinstaller DLSS_Manager_Linux.spec --distpath dist --workpath build/pyinstaller
#   flatpak-builder --user --force-clean --build-only build-dir io.github.goover.dlss_manager.yml
#   flatpak build-export repo build-dir
#   flatpak build-bundle repo DLSS_Manager.flatpak io.github.goover.dlss-manager

app-id: io.github.goover.dlss-manager
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk

command: dlss-manager

finish-args:
  # Display & Graphics (required for Flutter UI)
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc

  # Network (for DLSS update checks and downloads)
  - --share=network

  # Filesystem - broad coverage for game directories
  # Read-only access to detect and scan game installations
  - --filesystem=home:rw
  - --filesystem=/mnt:rw
  - --filesystem=/media:rw
  - --filesystem=/run/media:rw
  # Read-write access for app config, cache, and data
  - --filesystem=xdg-config/DLSS-Updater:rw
  - --filesystem=xdg-cache/DLSS-Updater:rw
  - --filesystem=~/.local/share/dlss-updater:create
  # Flet framework cache directory (required for Flet to initialize)
  - --filesystem=~/.flet:create

  # Portal support
  - --talk-name=org.freedesktop.portal.FileChooser
  # Secret service for flutter_secure_storage (used by Flet)
  - --talk-name=org.freedesktop.secrets

  # Environment: Ensure Flet's downloaded client can find libsecret
  - --env=LD_LIBRARY_PATH=/app/lib64:/app/lib
  # Keep the free-threaded Python GIL disabled at runtime
  - --env=PYTHON_GIL=0

modules:
  # libsecret - required by Flet's flutter_secure_storage
  # org.freedesktop.Platform does not include libsecret, so we build it
  - name: libsecret
    buildsystem: meson
    config-opts:
      - -Dmanpage=false
      - -Dvapi=false
      - -Dgtk_doc=false
      - -Dintrospection=false
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
      - /share/man
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libsecret/0.21/libsecret-0.21.4.tar.xz
        sha256: 163d08d783be6d4ab9a979ceb5a4fecbc1d9660d3c34168c581301cd53912b20


  - name: dlss-manager
    buildsystem: simple
    build-commands:
      # Install the PyInstaller-built executable
      - install -Dm755 dist/DLSS_Manager /app/bin/dlss_manager
      # Create wrapper script for consistent naming
      # Set LD_LIBRARY_PATH so Flet's runtime-downloaded client can find libsecret
      - printf '#!/bin/bash\nexport LD_LIBRARY_PATH="/app/lib64:/app/lib:$LD_LIBRARY_PATH"\nexec /app/bin/dlss_manager "$@"\n' > /app/bin/dlss-manager
      - chmod +x /app/bin/dlss-manager
      # Install desktop integration files (derived from single source-of-truth metainfo & desktop files)
      - sed 's/io\.github\.goover\.dlss_manager/io.github.goover.dlss-manager/g' io.github.goover.dlss_manager.metainfo.xml > /tmp/metainfo.xml && install -Dm644 /tmp/metainfo.xml /app/share/metainfo/io.github.goover.dlss-manager.metainfo.xml
      - sed -e 's/\r$//' -e 's/io\.github\.goover\.dlss_manager/io.github.goover.dlss-manager/g' flatpak/io.github.goover.dlss_manager.desktop > /tmp/desktop.tmp && install -Dm644 /tmp/desktop.tmp /app/share/applications/io.github.goover.dlss-manager.desktop
      - install -Dm644 dlss_manager/icons/dlss_manager.png /app/share/icons/hicolor/256x256/apps/io.github.goover.dlss-manager.png
    sources:
      - type: dir
        path: .

