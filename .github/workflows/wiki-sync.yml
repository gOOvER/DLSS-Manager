name: Sync Wiki

on:
  push:
    branches:
      - main
    paths:
      - "wiki/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    name: Sync wiki/ directory to GitHub Wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v7

      - name: Push wiki pages to GitHub Wiki repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WIKI_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          TMP_DIR="$(mktemp -d)"
          if git clone "${WIKI_URL}" "${TMP_DIR}" 2>/dev/null; then
            echo "Cloned existing wiki repository."
          else
            echo "Initializing new wiki repository..."
            git init -b master "${TMP_DIR}"
            git -C "${TMP_DIR}" remote add origin "${WIKI_URL}"
          fi
          find "${TMP_DIR}" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -r wiki/. "${TMP_DIR}/"
          cd "${TMP_DIR}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes to push."
          else
            git commit -m "docs(wiki): sync wiki pages from main (${GITHUB_SHA::7})"
            git push -u origin HEAD:master --force
          fi
