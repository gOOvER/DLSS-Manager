name: Build Flatpak

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., 3.5.0)'
        required: false
        default: ''
  release:
    types: [published]

jobs:
  build-flatpak:
    runs-on: ubuntu-22.04  # Match AppImage build environment for GLIBC compatibility

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "release" ]; then
            VERSION="$RELEASE_TAG"
            VERSION="${VERSION#v}"
            VERSION="${VERSION#V}"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(grep -oP '__version__\s*=\s*"\K[^"]+' dlss_manager/version.py)
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            flatpak \
            flatpak-builder \
            libmpv1 \
            libgtk-3-0 \
            libwebkit2gtk-4.0-37 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libgstreamer1.0-0

      - name: Set up Flatpak
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python 3.15 (free-threaded)
        run: |
          uv python install 3.15+freethreaded
          uv python pin 3.15+freethreaded

      - name: Install Python dependencies
        run: uv sync

      - name: Build with Flet
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Use flet build linux - the recommended way to build Linux apps
          uv run flet build linux \
            --project "DLSS_Manager" \
            --product "DLSS Manager" \
            --org "io.github.goover" \
            --description "Update DLSS/XeSS/FSR DLLs for games" \
            --build-version "$BUILD_VERSION"

          # Move build output to expected location for Flatpak
          mkdir -p dist
          cp -r build/linux/* dist/
          ls -la dist/
          # Verify binary was created
          test -f dist/dlss_manager || { echo "Flet build failed"; exit 1; }

      - name: Build Flatpak
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          flatpak-builder --user --force-clean --repo=repo build-dir io.github.goover.dlss_manager.yml
          flatpak build-bundle repo "DLSS_Manager-${BUILD_VERSION}.flatpak" io.github.goover.dlss-manager
          ls -lh *.flatpak

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v7
        with:
          name: DLSS_Manager-Linux-Flatpak
          path: "*.flatpak"
          retention-days: 30

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: "*.flatpak"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
