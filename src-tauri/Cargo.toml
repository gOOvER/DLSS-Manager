[package]
name = "dlss-manager"
version = "1.0.0-beta.1"
description = "High-performance DLSS, FSR, XeSS, DirectStorage, and Streamline DLL Manager for games"
authors = ["gOOvER", "Recol (Deco)"]
license = "AGPL-3.0-only"
repository = "https://github.com/gOOvER/DLSS-Manager"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dlss_manager_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
rayon = "1"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
libloading = "0.8"
anyhow = "1"
thiserror = "2"
log = "0.4"
once_cell = "1"
regex = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
] }

[profile.release]
panic = "abort"
codegen-units = 16
lto = "thin"
opt-level = "s"
strip = true

